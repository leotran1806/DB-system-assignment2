<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <title>{% block title %}Parcel Delivery{% endblock %} · Admin Console</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="{{ url_for('shippers.index') }}"><span class="brand-icon">P</span> Parcel Delivery <span class="brand-subtitle">ADMIN CONSOLE</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ url_for('shippers.index') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('shippers.') else '' }}">Shippers</a>
        <a href="{{ url_for('reports.index') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('reports.') else '' }}">Reports</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="container footer">On-demand Parcel Delivery System · Database Assignment 2</footer>
</body>
</html>
